name: Kitchen United
description: 'Kitchen United was a Pasadena, California ghost-kitchen operator that
  built and ran shared commissary kitchens — branded "Kitchen United Mix" — where multiple
  restaurant brands cooked out of one facility for delivery and pickup, including a
  chain of in-store food halls operated with Kroger. Backed by GV (Google Ventures)
  among others, the company wound down its physical footprint: in late 2023 it announced
  it would sell or close all remaining units and pivot to licensing its ordering software,
  and on 2024-03-14 sbe/C3 founder Sam Nazarian acquired its intellectual property and
  ghost-kitchen assets into a new holding company, Everybody Eats, alongside C3 and
  Nextbite. Kitchen United never published a public developer API, SDK, CLI or developer
  portal, and no OpenAPI, AsyncAPI or package-registry artifact exists for it. The
  kitchenunited.com domain still resolves but now serves a residual WordPress shell
  whose only remaining page is unrelated SEO spam, so it should not be treated as a
  live developer surface. This profile is retained as a historical company record.'
